<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Otomasyon{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">
      <span class="brand-mark">O</span>
      <span>Otomasyon</span>
    </a>
    <nav>
      <a href="{{ url_for('index') }}">Performans</a>
      {% if session.get('authenticated') %}
        <a href="{{ url_for('coupons') }}">Kuponlar</a>
        <a href="{{ url_for('surprises') }}">Sürprizler</a>
        <form method="post" action="{{ url_for('logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="nav-button" type="submit">Çıkış</button>
        </form>
      {% else %}
        <a class="private-link" href="{{ url_for('login') }}">Özel giriş</a>
      {% endif %}
    </nav>
  </header>
  <main class="shell">{% block content %}{% endblock %}</main>
  <footer>
    Otomatik bahis oynanmaz. Sonuçlar geçmiş performanstır; gelecek sonucu garanti etmez.
  </footer>
</body>
</html>
